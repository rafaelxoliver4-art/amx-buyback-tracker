# ---------------------------------------------------------------------------
# sources.yaml - every URL, selector, delay, retry count and date rule.
# No URL, selector, delay or date rule may be hardcoded in Python.
# ---------------------------------------------------------------------------

issuer:
  clave: AMX
  # BMV internal issuer id. Discovered via the issuer-search endpoint, NOT
  # guessable: the clave in the profile URL is decorative and ignored by BMV.
  id_emisora: 6024
  tipo_mercado: CGEN_CAPIT      # capitales (local equity)
  razon_social: "AMERICA MOVIL, S.A.B. DE C.V."
  expected_series: ["B"]        # anything else is an ALERT, not a silent pass
  # --- the pre-consolidation share structure (found by the Cycle 1 backfill)
  # Until March 2023 AMX filed recompras for THREE series - A, AA and L - and
  # no series B at all. The single series B begins 2023-03-17; the last
  # multi-series report is 2023-03-10. That is AMX's share consolidation, not
  # a parsing fault, so those series are declared here: they are recorded in
  # the ledger, summarised ONCE per run, and excluded from the derived series
  # (which is serie B only). A series outside BOTH lists still ALERTs.
  historical_series: ["A", "AA", "L"]
  historical_series_until: 2023-03-10

http:
  base_url: "https://www.bmv.com.mx"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  accept_language: "es-MX,es;q=0.9,en;q=0.8"
  timeout_seconds: 90
  delay_seconds: 2.0            # minimum gap between any two requests
  max_retries: 3
  backoff_base_seconds: 4.0     # 4s, 8s, 16s
  backoff_max_seconds: 120.0
  retry_on_status: [429, 500, 502, 503, 504]

robots:
  url: "https://www.bmv.com.mx/robots.txt"
  # Checked 2026-08-03: 404 on both www.bmv.com.mx and bmv.com.mx.
  # No robots.txt exists, therefore nothing is disallowed.
  # If this ever returns 200, honour_disallow makes the fetcher stop.
  honour_disallow: true

listing:
  # A single GET returns EVERY row. The page is server-rendered and the ~251
  # "pages" the user sees are DataTables client-side pagination (5 rows/page).
  # Note BMV's own typo in the path: "informcioncorporativa".
  url_template: "{base_url}/es/emisoras/informcioncorporativa/{clave}-{id_emisora}-{tipo_mercado}"
  # --- guards (Cycle 1, ruling 3) ------------------------------------------
  # There is deliberately NO cap on how much of the listing we parse: the whole
  # history is one request and is what proves nothing was missed. Instead we
  # guard the two ways that can go wrong.
  guards:
    # BMV returns all history with no date filter, so the response grows ~250
    # rows a year forever. Alert long before it becomes a problem.
    max_response_bytes: 10485760      # 10 MB
    # A SHRINKING history is a red flag - rows should only ever be added.
    # Compared against the row count of the previous run's inventory CSV.
    alert_if_fewer_rows_than_previous: true
  # The page holds several accordion sections; we want only this one.
  section_heading: "ADQUISICION DE ACCIONES POR EMISORA (RECOMPRAS)"
  asunto_expected: "Recompras"
  cell_index_fecha_hora: 0
  cell_index_asunto: 1
  cell_index_archivo: 2
  fecha_hora_format: "%d-%m-%Y %H:%M"
  link_href_prefix: "/docs-pub/recompra/"
  # doc id is an opaque incrementing EMISNET document id - NOT date-derivable.
  pdf_filename_regex: "recompra_(?P<doc_id>\\d+)_(?P<seq>\\d+)\\.pdf"

# --- which reports we actually download -----------------------------------
selection:
  # Cycle 1 (ruling 2): the FULL listing history. 2021-08-04 is the first
  # recompras row BMV holds for AMX. The chart needs three-plus years, and the
  # whole inventory arrives in the one request we already make.
  inventory_start: "2021-08-01"     # inventory is walked from here...
  inventory_end: "today"            # ...to here ("today" = run date)
  rules:
    last_of_iso_week: true
    last_of_calendar_month: true
  # Explicit extra reports. Each December's last report is already picked up by
  # last_of_calendar_month now that the window starts in 2021; this entry is
  # kept because the 2025-12 row is the anchor the owner's 2026 table starts on.
  anchor_reports:
    - month: "2025-12"              # last report of Dec-2025
  raw_pdf_filename_template: "{report_date}_{serie}.pdf"

# --- the one-off full backfill (src/backfill.py) --------------------------
backfill:
  # Same selection rule as above, applied across the full range, run once and
  # resumable: anything already in the ledger is skipped, so it is safe to run
  # twice. It never rewrites an existing ledger row.
  progress_every: 25                # log a progress line every N downloads
  parse_every: 50                   # flush parsed rows to the ledger every N

# --- PDF parsing ----------------------------------------------------------
parse:
  # Labels are matched case-insensitively with accents folded.
  header_labels:
    clave_cotizacion: "CLAVE DE COTIZACION"
    razon_social: "RAZON SOCIAL"
    fecha_operacion: "FECHA DE OPERACION"
    fecha_documento: "FECHA:"
  remanente:
    section: "REMANENTE DE RECURSOS"
    row_ultimo: "Al ultimo reporte"
    row_presente: "Al presente"
  saldos:
    section: "SALDOS"
    row_ultimo: "Al ultimo reporte"
    row_presente: "Al presente reporte"
    columns:
      acciones_tesoreria: "Acciones en Tesoreria"
      acciones_circulacion: "Acciones en Circulacion"
      acciones_cargo_cc: "Acciones con Cargo C.C."
  serie:
    block_heading: "OPERACION POR SERIE"
    serie_label: "SERIE"
    casa_de_bolsa_label: "CASA DE BOLSA"
  operaciones:
    section: "OPERACIONES"
    comentarios_label: "COMENTARIOS:"
  geometry:
    # chars whose |top| differ by less than this are on the same text line
    line_tolerance_pt: 2.0
    # a char joins the current run when its x0 is within this of the
    # previous char's x1. BMV renders some cells TWICE, overlapping; each
    # render is internally x-contiguous, so this cleanly separates them.
    run_join_tolerance_pt: 0.6
    # a numeric run must overlap its column header band by at least this much
    column_overlap_min_pt: 4.0
  # How to resolve a cell that contains two overlapping renders.
  overlap_resolution:
    # 1st: pick the candidate satisfying treasury/circulation conservation
    #      (delta tesoreria == -delta circulacion).
    use_conservation_identity: true
    # 2nd: fall back to the candidate x0-aligned with the unambiguous row.
    use_x_alignment_fallback: true
    # if neither resolves it, the report is logged unparsed - never guessed.

# --- derived series -------------------------------------------------------
series:
  # buyback_mxn   = remanente_prior + program_addition - remanente_current
  # shares_bought = shares_outstanding_prior - shares_outstanding_current
  # avg_price     = buyback_mxn / shares_bought
  # pct_outstand. = shares_bought / shares_outstanding_current
  week_rule: "iso"                  # ISO week, row = last report in the week
  month_rule: "calendar"            # row = last report in the calendar month
  # Ruling 4: a week with no report at all gets an EXPLICIT row - never a
  # silent gap. buyback_mxn = 0, shares_bought = 0, remanente and shares
  # outstanding carried forward from the prior row, no_report = TRUE.
  fill_empty_periods:
    weekly: true
    monthly: true                   # in practice never fires (~21 reports/mo)
  month_label_format: "%b-%y"       # "May-26" - the chart's x-axis label
  iso_week_format: "{year}-W{week:02d}"
  addition_round_to_mxn: 500000000  # propose additions to the nearest 0.5bn
  # when an unexplained remanente rise is found, download this many daily
  # reports around it to isolate the exact day
  jump_probe_days_before: 7
  jump_probe_days_after: 1

# --- workbook -------------------------------------------------------------
workbook:
  path: "output/AMX_Buybacks.xlsx"
  sheets:
    raw: "Raw"
    weekly: "Weekly"
    monthly: "Monthly"
    ytd: "YTD"
    alerts: "Alerts"          # Cycle 1: every ALERT/NOTICE of the run
    chart: "Chart"            # Cycle 1: the native Excel combo chart

  # --- styling (Cycle 1). Finance style: restrained, no heavy fills. -------
  style:
    body_font: "Calibri"
    body_size_pt: 10
    header_bold: true
    header_fill: null                 # deliberately NO fill
    header_bottom_border: "thin"
    header_border_color: "FF4A3F35"
    freeze_header: true               # freeze panes on every sheet
    autofilter: true                  # over the data range of every data sheet
    # An unhandled programme addition shows up as a NEGATIVE buyback. It must
    # be visible at a glance, not buried in the run log.
    negative_buyback_font_color: "FFC00000"
    column_width_min: 10
    column_width_max: 62
    column_width_padding: 2
    date_format: "dd-mmm-yyyy"

  # Weekly: ruling 6. Date = the week-ending REPORT date, plus ISO Week and
  # the Sunday that ends that ISO week.
  weekly_columns:
    - {key: date,                header: "Date",                        number_format: "dd-mmm-yyyy"}
    - {key: iso_week,            header: "ISO Week",                    number_format: "General"}
    - {key: week_ending_sun,     header: "Week Ending (Sun)",           number_format: "dd-mmm-yyyy"}
    - {key: remanente,           header: "Remaining Resources (MXN)",   number_format: "#,##0"}
    - {key: buyback_mxn,         header: "Buybacks (MXN mn)",           number_format: "#,##0,,"}
    - {key: shares_outstanding,  header: "Shares Outstanding",          number_format: "#,##0"}
    - {key: shares_bought,       header: "Buybacks (# Shares)",         number_format: "#,##0"}
    - {key: avg_price,           header: "Avg. Buyback Price (MXN)",    number_format: "#,##0.00"}
    - {key: program_addition,    header: "Program Addition (MXN)",      number_format: "#,##0"}
    - {key: pct_outstanding,     header: "% Shares Outstanding",        number_format: "0.00%"}
    - {key: no_report,           header: "No Report",                   number_format: "General"}
    - {key: source_report_date,  header: "Source Report Date",          number_format: "dd-mmm-yyyy"}
    - {key: pdf_url,             header: "Source PDF URL",              number_format: "General"}

  monthly_columns:
    # A-F EXACTLY as the owner's format, in this order and wording.
    # Ruling 5: Date is the TRUE BMV report date. The owner's month-end labels
    # were approximations and are NOT preserved.
    - {key: date,                header: "Date",                        number_format: "dd-mmm-yyyy"}
    - {key: remanente,           header: "Remaining Resources (MXN)",   number_format: "#,##0"}
    - {key: buyback_mxn,         header: "Buybacks (MXN mn)",           number_format: "#,##0,,"}
    - {key: shares_outstanding,  header: "Shares Outstanding",          number_format: "#,##0"}
    - {key: shares_bought,       header: "Buybacks (# Shares)",         number_format: "#,##0"}
    - {key: avg_price,           header: "Avg. Buyback Price (MXN)",    number_format: "#,##0.00"}
    # extras from column G onward
    - {key: program_addition,    header: "Program Addition (MXN)",      number_format: "#,##0"}
    - {key: pct_outstanding,     header: "% Shares Outstanding",        number_format: "0.00%"}
    - {key: source_report_date,  header: "Source Report Date",          number_format: "dd-mmm-yyyy"}
    - {key: pdf_url,             header: "Source PDF URL",              number_format: "General"}
    # Ruling 5: appended at K so the documented A-J order is undisturbed.
    # This is the chart's x-axis label.
    - {key: month_label,         header: "Month",                       number_format: "General"}
    - {key: no_report,           header: "No Report",                   number_format: "General"}

  # Cycle 1: the YTD sheet is also the Cycle 2 email table.
  ytd:
    title_template: "AMX Buybacks - {year} YTD (through {through})"
    columns:
      - {key: month_label,       header: "Month",                       number_format: "General"}
      - {key: buyback_mxn,       header: "Buybacks (MXN mn)",           number_format: "#,##0,,"}
      - {key: shares_bought,     header: "Buybacks (# shares, mn)",     number_format: "#,##0.0,,"}
      - {key: avg_price,         header: "Avg. Price (MXN)",            number_format: "#,##0.00"}
      - {key: pct_outstanding,   header: "% Shares Out",                number_format: "0.00%"}
    total_label: "TOTAL"
    # The TOTAL average price is WEIGHTED (total MXN / total shares), never a
    # mean of the monthly means. % Shares Out on the TOTAL row is measured
    # against shares outstanding at 31-Dec of the PRIOR year.
    total_avg_price_is_weighted: true

  alerts_columns:
    - {key: timestamp,      header: "Timestamp"}
    - {key: severity,       header: "Severity"}
    - {key: code,           header: "Code"}
    - {key: message,        header: "Message"}
    - {key: affected_date,  header: "Affected Date"}

# --- known defects in BMV's own data --------------------------------------
# Each PDF restates the prior report's figures under "al ultimo reporte",
# which gives a free check on the previously stored row. Where BMV itself is
# internally inconsistent the break is recorded HERE, explicitly and dated,
# so it stays visible - it is never absorbed by a blanket tolerance, and any
# NEW break still fails the integrity test.
integrity:
  known_source_discrepancies:
    - field: remanente
      report_date: 2026-04-24
      prior_report_date: 2026-04-23
      diff_mxn: 26
      note: >-
        The 24-Apr report opens at 20,997,161,415 while the 23-Apr report
        closed at 20,997,161,389. BMV's own restatement is 26 MXN higher.
        Harmless for us: the derived series chains "al presente" to
        "al presente" and never consumes "al ultimo". Observed 2026-08-03.

paths:
  raw_pdf_dir: "data/raw"
  ledger_csv: "data/raw_reports.csv"
  inventory_csv: "data/listing_inventory.csv"
  run_log: "data/run_log.txt"
