# ---------------------------------------------------------------------------
# schedule.yaml - the weekly unattended run.
#
# The cron below is the SOURCE OF TRUTH for humans, but GitHub Actions cannot
# read this file: the schedule has to be a literal in
# .github/workflows/weekly.yml. The two are therefore duplicated, and a test
# (tests/test_workflow.py) asserts they agree, so they can never drift apart.
# ---------------------------------------------------------------------------

enabled: true

cron: "17 1 * * 6"          # Saturday 01:17 UTC == FRIDAY 22:17 Sao Paulo

# WHY 01:00 UTC SATURDAY (2026-08-05: moved from 12:00 UTC at the owner's
# request, so the mail lands on Friday evening rather than Saturday morning)
#
# THE ARITHMETIC, written out - both zones are fixed, neither observes DST:
#
#   Mexico City  UTC-6  (DST abolished October 2022)
#   Sao Paulo    UTC-3  (DST abolished 2019)
#   => Mexico City is 3 hours BEHIND Sao Paulo.
#
#   BMV files      16:39-17:59  Mexico City   (the observed range, 343 reports)
#                = 19:39-20:59  Sao Paulo
#                = 22:39-23:59  UTC, Friday
#
#   The run at    01:17 UTC Saturday
#                = 22:17 Friday, Sao Paulo   <- when the owner reads it
#                = 19:17 Friday, Mexico City
#
#   That is ~1.3 hours after the LATEST filing ever observed (23:59 UTC).
#
# WHY :17 AND NOT :00  -- DO NOT "TIDY" THIS BACK TO THE TOP OF THE HOUR
#
# GitHub documents that scheduled workflows can be DELAYED OR DROPPED when the
# Actions queue is busy, and the top of the hour is the single worst slot -
# it is the default everybody writes, so every :00 cron in the world competes
# for the same runners at the same instant. An odd offset a few minutes in
# sidesteps that crowd almost entirely, at the cost of 17 minutes' latency
# that nobody can perceive in a WEEKLY job.
#
# A dropped run is not a data loss here (see the buffer note below) - but it
# is a missed email, and a missed email looks exactly like a dead job.
#
# WHY A ~1 HOUR BUFFER IS ACCEPTABLE
#
# The fetcher selects by WALKING THE LISTING, not by asking for "today", and
# the ledger is APPEND-ONLY. So a report that is late, or missed entirely, is
# simply picked up by the following week's run and appended then. A late
# filing costs FRESHNESS for one week; it can never cost DATA, and it can
# never produce a wrong figure - the acceptance gate would catch that.
#
# If more clearance is ever wanted, change the hour in TWO places -
# this file and .github/workflows/weekly.yml - and the test that asserts they
# agree will hold the pair together. That is the whole fix.
#
# GitHub also queues scheduled jobs under load and may start them minutes
# late, which eats into a 1-hour buffer more than it did a 12-hour one. Same
# consequence: a week's freshness, never data.

run:
  cadence: weekly
  day_of_week: "saturday"           # in UTC; Friday evening in Sao Paulo
  time_utc: "01:17"
  owner_local_time: "22:17 Friday America/Sao_Paulo"

publication:
  typical_time_local: "17:30"
  timezone: "America/Mexico_City"   # UTC-6 year round, no DST since 2022

behaviour:
  # a run that returns zero reports raises an ALERT; it never wipes or
  # truncates data/raw_reports.csv
  alert_on_zero_reports: true
  alert_on_unconfirmed_program_addition: true
  alert_on_parse_failure: true
  alert_on_unexpected_serie: true
  alert_on_integrity_mismatch: true
  # A week with no new BMV reports still sends an email saying so. A silent
  # week is indistinguishable from a dead job.
  email_even_when_no_new_reports: true
