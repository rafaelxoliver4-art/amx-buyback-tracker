# ---------------------------------------------------------------------------
# email.yaml - the whole email shape. NO CREDENTIALS, EVER.
#
# Two names appear below - FROM_EMAIL and EMAIL_APP_PASSWORD. They are the
# NAMES of a GitHub Actions variable and secret that the OWNER creates by
# hand. Their VALUES are never stored here, never defaulted in Python, never
# logged, and never printed. src/send_email.py reads them from the
# ENVIRONMENT and from nowhere else; if either is absent it refuses to send.
#
# The SMTP host and port are NOT credentials and live here, per the standing
# "config over code" rule - no address or host literal belongs in Python.
# ---------------------------------------------------------------------------

enabled: true

to: rafaelxoliver4@gmail.com

# --- names only, never values ---------------------------------------------
from_env: FROM_EMAIL              # Actions VARIABLE  -> ibotatom@gmail.com
password_env: EMAIL_APP_PASSWORD  # Actions SECRET    -> a Gmail app password

smtp:
  host: smtp.gmail.com
  port: 587
  starttls: true

subject:
  normal: "AMX buybacks — week to {report_date}"
  alert: "[ALERT] AMX buybacks — week to {report_date}"

attach:
  - output/AMX_Buybacks.xlsx
  - output/amx_buybacks_chart.png

body:
  # The chart is embedded BY CID, not linked. Gmail does not render a linked
  # image from a private repo - the reader is not authenticated to it - so a
  # linked chart would arrive as a broken image every week.
  chart_cid: amx-buyback-chart
  chart_path: output/amx_buybacks_chart.png
  ytd_sheet: YTD
  # Ruling 5: the five unconfirmed programme additions emit one INFO each,
  # every week, BY DESIGN. That is the correct resting state, not a defect.
  # They render as a quiet footnote; only ALERTs get the prominent block.
  quiet_notice_severities: ["INFO"]
  loud_notice_severities: ["ALERT"]
  no_new_reports_text: >-
    No new BMV reports were published this week. The figures below are
    unchanged from last week's run.
